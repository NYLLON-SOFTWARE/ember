[package]
name = "ember_kit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rails_compat.workspace = true
ruby_compat.workspace = true
axum.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
base64.workspace = true
rand.workspace = true
sha2.workspace = true
percent-encoding.workspace = true
tempfile.workspace = true
multer.workspace = true
http-body-util.workspace = true
futures-util.workspace = true
uuid.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "http1", "http2", "tokio"] }
flate2.workspace = true
crc32fast.workspace = true
foldhash.workspace = true
indexmap.workspace = true
bytes.workspace = true
regex.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
instant-acme.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
zstd.workspace = true
url.workspace = true
p256 = { workspace = true, features = ["pkcs8", "pem"] }
libc.workspace = true
hex.workspace = true

# sha2 0.10 compiles its ARMv8 SHA-256 backend (used when the CPU has the instructions) only with
# `asm`; without it the arm64 image hashes every page body in software. Features unify, so this
# covers every sha2 user in the app. x86_64 detects SHA-NI without it.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[dev-dependencies]
hyper = { workspace = true, features = ["client", "http1", "http2"] }
# tests/front.rs: a WebSocket backend behind the front server
axum = { workspace = true, features = ["ws"] }
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
