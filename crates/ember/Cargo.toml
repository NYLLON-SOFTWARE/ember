[package]
name = "ember"
version = "1.0.0"
default-run = "ember"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ember"
path = "src/main.rs"

# Keep existing install scripts and locally built commands working.
[[bin]]
name = "matchbox"
path = "src/legacy_main.rs"
test = false
bench = false

[lints]
workspace = true

[dependencies]
rails_compat.workspace = true
ruby_compat.workspace = true
ember_kit.workspace = true
ember_routes.workspace = true
ember_db.workspace = true
ember_richtext.workspace = true
ember_storage.workspace = true
ember_cable.workspace = true
ember_assets.workspace = true
ember_views.workspace = true
anyhow.workspace = true
tikv-jemallocator.workspace = true
libc.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
jiff.workspace = true
tracing.workspace = true
async-trait.workspace = true
regex.workspace = true
askama.workspace = true
futures-util.workspace = true
rusqlite = { workspace = true, features = ["backup"] }
tempfile.workspace = true
rand.workspace = true
hex.workspace = true
percent-encoding.workspace = true
tracing-subscriber.workspace = true
# integrations/
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
p256.workspace = true
hkdf.workspace = true
aes-gcm.workspace = true
sha2.workspace = true
flate2.workspace = true
uuid.workspace = true
thiserror.workspace = true

[dev-dependencies]
ember_db = { workspace = true, features = ["test-support"] }
base64.workspace = true
tikv-jemalloc-sys.workspace = true
tower = { workspace = true, features = ["util"] }
# axum::serve in the channel tests
axum = { workspace = true, features = ["http1"] }
tokio-tungstenite.workspace = true
