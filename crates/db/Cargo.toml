[package]
name = "ember_db"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite.workspace = true
jiff.workspace = true
rails_compat.workspace = true
serde_json.workspace = true
serde_yaml = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
rand.workspace = true
uuid.workspace = true
crc32fast = { workspace = true, optional = true }
tracing.workspace = true
base64 = { workspace = true, optional = true }

[features]
# `ember_db::fixtures`, the reference's test fixtures loaded into a database, and
# `ember_db::testing`: `Env::default`, event sinks and a rich-text stand-in.
test-support = ["dep:serde_yaml", "dep:crc32fast", "dep:base64"]

[dev-dependencies]
ember_db = { path = ".", features = ["test-support"] }
tempfile.workspace = true
sha1.workspace = true
hex.workspace = true

# The self dev-dependency turns on `test-support` for the crate's own tests.
[package.metadata.cargo-shear]
ignored = ["ember_db"]
