{% macro icon(name) %}
<svg class="ui-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{% if name == "flame" %}
  <path d="M12 3c-3 3-1.5 5.5.5 7.5 1.5 1.5 1 3-1 3.5-1.5.4-3-1-3.5-2.5C5 15 6.5 21 12 21c4.4 0 7-3 7-6.5C19 9.5 13 7.5 12 3Z"/>
{% else if name == "user" %}
  <circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/>
{% else if name == "mail" %}
  <rect x="3" y="4" width="18" height="16" rx="2"/><path d="m3 6 9 7 9-7"/>
{% else if name == "lock" %}
  <rect x="4" y="10" width="16" height="11" rx="2"/><path d="M7 10V7a5 5 0 0 1 10 0v3"/>
{% else if name == "eye" %}
  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
{% else if name == "camera" %}
  <path d="M4 6h4l2-3h4l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2Z"/><circle cx="12" cy="13" r="4"/>
{% else if name == "arrow-right" %}
  <path d="M5 12h14m-6-6 6 6-6 6"/>
{% endif %}
</svg>
{% endmacro %}
