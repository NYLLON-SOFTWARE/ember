{# The original composer controller, upload endpoints and editor contracts are retained. #}
  <div class="composer mb-composer"
      data-controller="typing-notifications" data-typing-notifications-active-class="typing-indicator--active">
    <turbo-frame id="composer-frame">
      <form id="composer" class="mb-composer-form" data-controller="composer drop-target" data-action="dragenter-&gt;drop-target#dragenter dragover-&gt;drop-target#dragover drop-&gt;drop-target#drop drop-target:drop@window-&gt;composer#dropFiles lexxy:file-accept-&gt;composer#preventAttachment refresh-room:online@window-&gt;composer#online typing-notifications#stop paste-&gt;composer#pasteFiles turbo:submit-end-&gt;composer#submitEnd refresh-room:offline@window-&gt;composer#offline" data-composer-messages-outlet="#message-area" data-composer-toolbar-class="composer--rich-text" data-composer-room-id-value="{{ room.id }}" action="{{ h::routes::room_messages(room.id) }}" accept-charset="UTF-8" method="post">
        <fieldset data-composer-target="fields" contents>
          <div class="composer__filelist flex flex--align-center gap flex-wrap" data-composer-target="fileList"></div>
          <div class="composer__input mb-composer-card">
            <div class="mb-composer-editor">
<lexxy-editor rows="2" class="input lexxy-content" aria-multiline="true" aria-label="Write a message" placeholder="Message {% if !room.is_direct() %}#{% endif %}{{ room.display_name }}" permitted-attachment-types="application/vnd.campfire.mention application/vnd.actiontext.opengraph-embed" data-controller="unfurl" data-action="lexxy:change-&gt;typing-notifications#start keydown-&gt;composer#submitByKeyboard:capture lexxy:change-&gt;composer#saveDraft lexxy:insert-link-&gt;unfurl#unfurl" data-composer-target="text" data-direct-upload-url="{{ ctx.url("/rails/active_storage/direct_uploads") }}" data-blob-url-template="{{ ctx.url("/rails/active_storage/blobs/redirect/:signed_id/:filename") }}" id="message_body" input="message_body_trix_input_message" name="message[body]">
<lexxy-prompt trigger="@" name="mention" src="{{ crate::rooms::mention_prompt_src(*room.id) }}" remote-filtering="true" empty-results="No matches"></lexxy-prompt>
</lexxy-editor>
            </div>
            <div class="mb-composer-toolbar">
              <label class="btn btn--borderless composer__attachment-btn input--file" title="Attach files">
                <img class="colorize--black" aria-hidden="true" src="{{ ctx.asset("attachment.svg") }}" width="22" height="22" />
                <input type="file" data-action="composer#filePicked" multiple />
                <span class="for-screen-reader">Attach a file</span>
              </label>
              <button class="btn btn--borderless composer__rich-text-btn" type="button" data-action="composer#toggleToolbar" title="Formatting options">
                <img class="colorize--black" aria-hidden="true" src="{{ ctx.asset("text-options.svg") }}" width="20" height="20" />
                <span class="for-screen-reader">Rich text</span>
              </button>
              <button name="send" type="submit" data-action="composer#submit" class="btn btn--reversed mb-composer-send" title="Send message">
                <img aria-hidden="true" src="{{ ctx.asset("arrow-up.svg") }}" width="20" height="20" />
                <span class="for-screen-reader">Send Message</span>
              </button>
            </div>
          </div>
        </fieldset>
        <div class="typing-indicator gap txt-small align-center flex-inline" data-typing-notifications-target="indicator">
          <div class="typing-indicator__author spinner" data-typing-notifications-target="author"></div>
        </div>
        <input data-composer-target="clientid" type="hidden" name="message[client_message_id]" id="message_client_message_id" />
      </form>
    </turbo-frame>
  </div>
