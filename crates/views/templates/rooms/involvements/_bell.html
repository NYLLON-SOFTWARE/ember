{#- reference/app/views/rooms/involvements/_bell.html.erb -#}
<span>
  <span class="button_to_change_notifying"
      data-controller="notifications" data-notifications-subscriptions-url-value="{{ h::routes::user_push_subscriptions() }}" data-notifications-attention-class="btn--pulsing">
    <turbo-frame data-controller="turbo-frame" data-action="notifications:ready@window-&gt;turbo-frame#load" data-turbo-frame-url-param="{{ h::routes::room_involvement(room.id) }}" id="{{ room.dom_id("involvement") }}">
      <button type="button" class="btn" title="Enable notifications" data-action="click->notifications#attemptToSubscribe" data-notifications-target="bell">
        <img aria-hidden="true" src="{{ ctx.asset("notification-bell-loading.svg") }}" width="20" height="20" />
        <span class="for-screen-reader">Enable notifications</span>
      </button>
</turbo-frame>
    <dialog aria-label="Notification setup" data-notifications-target="notAllowedNotice" class="dialog pad center center-block border-radius border shadow" style="--inline-space: var(--block-space)">
      <div class="flex flex-column txt-align-center">
        <span class="btn btn--faux center txt-x-large">
          <img aria-hidden="true" src="{{ ctx.asset("notification-bell-alert.svg") }}" width="48" height="48" />
          <span class="for-screen-reader">Notifications alert</span>
        </span>

        <section>
          <h1 class="txt-large margin-none" data-notifications-target="noticeTitle">Enable notifications</h1>
          <p data-notifications-target="noticeMessage" role="status"></p>
          <div class="txt-align-start margin-block-start" data-notifications-target="help">
            {% include "pwa/_browser_settings.html" %}
            {% include "pwa/_system_settings.html" %}
            {% include "pwa/_install_instructions.html" %}
          </div>
        </section>

        <form method="dialog" class="flex align-center gap center">
          <button class="btn dialog__close" autofocus="true">
            <span class="for-screen-reader">Close</span>
            <img aria-hidden="true" src="{{ ctx.asset("remove.svg") }}" width="20" height="20" />
          </button>
        </form>
      </div>
    </dialog>
  </span>
</span>
