{# Matchbox reaction form; preserve the reference's submission, validation, and Turbo targets. #}
<turbo-frame id="{{ message.dom_id("new_boost") }}">
  <div class="mb-custom-reaction">
    <form class="boost__form mb-custom-reaction-form" data-controller="form scroll-into-view" data-turbo-frame="{{ message.dom_id("boosting") }}" data-action="keydown.esc-&gt;form#cancel" action="{{ message.boosts_path() }}" accept-charset="UTF-8" method="post">
      <div class="mb-custom-reaction-heading">
        <img class="mb-custom-reaction-avatar" src="{{ user.avatar_url }}" alt="" width="28" height="28" />
        <label for="{{ message.dom_id("boost_content") }}">Custom reaction</label>
      </div>
      <input id="{{ message.dom_id("boost_content") }}" autofocus="autofocus" autocomplete="off" autocorrect="off" maxlength="16" required="required" pattern="\S+.*" data-boost-form-target="input" class="input input--boost" placeholder="Emoji or a short message" aria-describedby="{{ message.dom_id("boost_hint") }}" type="text" name="boost[content]" />
      <p id="{{ message.dom_id("boost_hint") }}" class="mb-custom-reaction-hint">Up to 16 characters.</p>
      <div class="mb-custom-reaction-actions">
        <a data-turbo-frame="{{ message.dom_id("boosts") }}" data-form-target="cancel" class="btn" href="{{ message.boosts_path() }}">Cancel</a>
        <button name="button" type="submit" class="btn btn--reversed">Add reaction</button>
      </div>
    </form>
  </div>
</turbo-frame>
