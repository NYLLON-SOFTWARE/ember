# Ember owns the presentation of these explicitly enumerated application pages.
# Replacement checks: reviewed DOM snapshots + npm run test:kro. Historical Rails fixtures stay.
# HTTP status remains strict even when the server-HTML layer is allowed. Network and Cable
# are deliberately NOT exempt: changed HTML hashes/assets/sidebar broadcasts need narrow review
# when running the full Rails capture. New states and non-page fragments remain strict by default.
# These three responses embed the owned compact message actions; only their HTML presentation
# differs. HTTP statuses, network/Cable checks, and all other protocol fragments remain strict.
- { state: messages/index/fragment, layers: [server], reason: Ember compact message actions; README Known differences, owner: views }
- { state: messages/show/fragment, layers: [server], reason: Ember compact message actions; README Known differences, owner: views }
- { state: rooms/refresh/fragment, layers: [server], reason: Ember compact message actions; README Known differences, owner: views }
# Ember snapshots also cover the unified logo picker, personal channel order controls,
# Lucide channel icon picker, and notification setup dialog. Icon persistence, access checks,
# and live sidebar/header updates use disposable native browser tests. SVG preview behavior
# is covered by the same browser harness;
# the reference has no corresponding preview, and its download headers remain unchanged.

- state: pwa/manifest
  layers: [server]
  reason: The manifest is JSON-escaped rather than HTML-escaped (README, Known differences)
  owner: views

- state: pwa/manifest/custom_styles
  layers: [server]
  reason: The custom-styles manifest uses the same deliberate JSON escaping
  owner: views

- state: auth/sign_in
  layers: [pixels, server, live, aria]
  reason: Ember owns the responsive workspace shell and page designs; reviewed DOM snapshots and native browser checks cover presentation and interactions (README, Known differences)
  owner: views

