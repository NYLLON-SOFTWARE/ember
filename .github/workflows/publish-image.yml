name: Build images and release Ember

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Stable MAJOR.MINOR.PATCH (never reuse a version)
        required: true
        type: string
      commit:
        description: Exact 40-character commit SHA on main
        required: true
        type: string

# One publisher at a time, including development images. A release is never cancelled midway.
concurrency:
  group: ember-image-publication
  cancel-in-progress: false
permissions: {}
env:
  IMAGE: ghcr.io/nyllon-software/ember

jobs:
  identity:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_COMMIT: ${{ inputs.commit }}
          SELECTED_VERSION: ${{ inputs.version }}
          STABLE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = NYLLON-SOFTWARE/ember
          if [ "$STABLE" = true ]; then test "$GITHUB_REF" = refs/heads/main; fi
          commit=$(git rev-parse HEAD)
          version=${commit:0:12}
          if [ "$STABLE" = true ]; then
            python3 deploy/release/release.py guard "$SELECTED_VERSION" "$SELECTED_COMMIT"
            version=$SELECTED_VERSION
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: identity
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.identity.outputs.commit }}
    permissions:
      contents: read

  build:
    needs: [identity, checks]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
          submodules: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: |
            APP_VERSION=${{ needs.identity.outputs.version }}
            GIT_REVISION=${{ needs.identity.outputs.commit }}
            OCI_SOURCE=https://github.com/NYLLON-SOFTWARE/ember
          cache-from: type=gha,scope=linux/${{ matrix.arch }}
          cache-to: type=gha,scope=linux/${{ matrix.arch }},mode=max
          sbom: false
          provenance: false
      - name: Record immutable architecture digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/$ARCH"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: false

  index:
    needs: [identity, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: index
        env:
          COMMIT: ${{ needs.identity.outputs.commit }}
          STABLE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          amd64=$(cat digests/amd64)
          arm64=$(cat digests/arm64)
          [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ && "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
          candidate="$IMAGE:candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$candidate" "$IMAGE@$amd64" "$IMAGE@$arm64"
          digest=$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [ "$STABLE" = false ]; then
            docker buildx imagetools create --tag "$IMAGE:main" --tag "$IMAGE:sha-${COMMIT:0:12}" "$IMAGE@$digest"
          fi
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Sign candidate index by digest
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

  bundle:
    needs: [identity, index]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Require anonymous candidate downloads
        env:
          DIGEST: ${{ needs.index.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous-docker" docker pull "$IMAGE@$DIGEST"
      - name: Build versioned installer artifacts
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT: ${{ needs.identity.outputs.commit }}
          DIGEST: ${{ needs.index.outputs.digest }}
        run: python3 deploy/installer/build-bundle.py --version "$VERSION" --source-sha "$COMMIT" --image-digest "$DIGEST" --output-dir release-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stable-candidate
          path: release-assets/
          retention-days: 30

  guests:
    needs: [identity, bundle]
    uses: ./.github/workflows/installer-guests.yml
    with:
      commit: ${{ needs.identity.outputs.commit }}
      artifact: stable-candidate
      public: false
    permissions:
      contents: read

  promote:
    needs: [identity, index, guests]
    runs-on: ubuntu-24.04
    environment: ember-release
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stable-candidate
          path: release-assets
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Recheck identity, then promote the tested index
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT: ${{ needs.identity.outputs.commit }}
          DIGEST: ${{ needs.index.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --certificate-identity "https://github.com/NYLLON-SOFTWARE/ember/.github/workflows/publish-image.yml@refs/heads/main" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$IMAGE@$DIGEST"
          python3 deploy/release/release.py reserve "$VERSION" "$COMMIT"
          docker buildx imagetools create --tag "$IMAGE:v$VERSION" --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          for tag in "v$VERSION" "$VERSION"; do
            actual=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            test "$actual" = "$DIGEST"
          done
          printf 'Source: `%s`\n\nImage: `%s@%s`\n\nAll four installation and recovery guests passed against these exact artifacts.\n' "$COMMIT" "$IMAGE" "$DIGEST" > release-notes.md
          gh release create "v$VERSION" release-assets/* --verify-tag --repo NYLLON-SOFTWARE/ember --target "$COMMIT" --title "Ember $VERSION" --notes-file release-notes.md --latest=false

  deploy:
    needs: [identity, promote]
    runs-on: ubuntu-24.04
    environment: ember-release
    permissions:
      contents: read
    outputs:
      previous: ${{ steps.previous.outputs.version }}
      previous-deployment: ${{ steps.previous.outputs.deployment }}
      candidate-deployment: ${{ steps.candidate.outputs.deployment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: stable-candidate
          path: release-assets
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --prefix deploy/release
      - id: previous
        name: Capture current Cloudflare deployment for recovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b9a05c0456567559ed575566fc5bb3f3
        run: node deploy/release/cloudflare.mjs previous
      - id: worker
        name: Deploy tested installer, manifest, and guide
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT: ${{ needs.identity.outputs.commit }}
        run: |
          set -euo pipefail
          python3 deploy/release/release.py promotion "$VERSION" "$COMMIT"
          python3 deploy/release/release.py worker release-assets deploy/installer/published.mjs
          deploy/release/node_modules/.bin/wrangler deploy --config deploy/installer/wrangler.jsonc --message "Ember release run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
      # Keep candidate identity even if Wrangler fails after activating the Worker. Job outputs
      # also remain available when only public verification or rollback is retried later.
      - id: candidate
        name: Capture the deployment produced by this attempt
        if: always() && steps.previous.outcome == 'success' && steps.worker.outcome != 'skipped'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b9a05c0456567559ed575566fc5bb3f3
          PREVIOUS_DEPLOYMENT: ${{ steps.previous.outputs.deployment }}
          DEPLOYMENT_MESSAGE: Ember release run ${{ github.run_id }} attempt ${{ github.run_attempt }}
        run: node deploy/release/cloudflare.mjs candidate

  public-verification:
    needs: [identity, deploy]
    uses: ./.github/workflows/installer-guests.yml
    with:
      commit: ${{ needs.identity.outputs.commit }}
      artifact: stable-candidate
      public: true
    permissions:
      contents: read

  rollback-installer:
    needs: [identity, deploy, public-verification]
    if: always() && needs.deploy.outputs.previous != '' && (needs.deploy.result != 'success' || needs.public-verification.result != 'success')
    runs-on: ubuntu-24.04
    environment: ember-release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --prefix deploy/release
      - name: Restore previous installer; withhold website promotion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b9a05c0456567559ed575566fc5bb3f3
          PREVIOUS_VERSION: ${{ needs.deploy.outputs.previous }}
          CANDIDATE_DEPLOYMENT: ${{ needs.deploy.outputs.candidate-deployment }}
        run: node deploy/release/cloudflare.mjs restore

  website-ready:
    needs: [identity, index, promote, public-verification]
    runs-on: ubuntu-24.04
    environment: ember-release
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Promote public-verified image aliases and latest release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.identity.outputs.version }}
          COMMIT: ${{ needs.identity.outputs.commit }}
          DIGEST: ${{ needs.index.outputs.digest }}
        run: |
          set -euo pipefail
          python3 deploy/release/release.py promotion "$VERSION" "$COMMIT"
          minor=${VERSION%.*}
          major=${VERSION%%.*}
          docker buildx imagetools create --tag "$IMAGE:$minor" --tag "$IMAGE:$major" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          for tag in "$minor" "$major" latest; do
            actual=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            test "$actual" = "$DIGEST"
          done
          gh release edit "v$VERSION" --repo NYLLON-SOFTWARE/ember --latest
          echo 'Public installation passed on Ubuntu 24.04 and Debian 13, amd64 and arm64.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Website installation link: https://get.nyllon.com/' >> "$GITHUB_STEP_SUMMARY"
