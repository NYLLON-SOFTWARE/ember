name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  frontend-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/assets/overrides/basecoat/package-lock.json
      - name: Verify generated frontend assets
        working-directory: crates/assets/overrides/basecoat
        run: |
          npm ci --ignore-scripts
          npm test
          npm run check
      - name: Test workspace frontend controllers
        run: node --test crates/assets/tests/*.test.mjs

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The Dockerfile's toolchain stage: Rust with the image's own libvips and ffmpeg builds.
      - name: Build toolchain image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: toolchain
          tags: ember-toolchain
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,scope=toolchain,mode=max

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cargo-home/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-

      - name: Build integration fixtures
        run: |
          parity/bin/reference build
          parity/bin/seed build

      # Each check runs even when an earlier one fails, so one run shows every failure.
      - name: Rustfmt, clippy and tests
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$PWD:/src" --workdir /src \
            --env HOME=/tmp --env CARGO_HOME=/src/.cargo-home --env CARGO_TERM_COLOR=always \
            --env EMBER_REQUIRE_SEED=1 \
            ember-toolchain sh -uc '
              status=0
              cargo fmt --all --check || status=1
              cargo clippy --locked --workspace --exclude html5ever --all-targets -- -D warnings || status=1
              cargo test --locked --no-fail-fast --workspace --exclude html5ever || status=1
              exit $status
            '

  benchmark-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout shared verification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: basecamp/once-campfire-verification
          ref: 6f71d70b5e1f17507404ad06cac134aa453a04a6
          path: verification
          persist-credentials: false

      - name: Install benchmark prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ruby ruby-minitest sqlite3 ffmpeg

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Test response and persistence gates
        run: |
          ruby verification/bench/test_contracts.rb
          ruby verification/bench/test_benchmark.rb
          ruby verification/bench/test_check_sample.rb
          ruby verification/bench/test_validate_acks.rb
          node verification/test/sidebar-reload.mjs crates/assets/overrides/controllers/rooms_list_controller.js
          node verification/test/editor-preservation.mjs crates/assets/overrides/controllers/rooms_list_controller.js
          node verification/test/autocomplete-json.mjs crates/assets/overrides/lib/autocomplete/base_autocomplete_handler.js

  # Dependencies declared but not used (cargo-shear reads the source; no build). Crates it can't
  # see through, like the assets build script's `#[path]` modules, are listed under
  # [package.metadata.cargo-shear] in their manifests.
  unused-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-shear
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-shear@1.14.0

      - name: Check for unused dependencies
        run: cargo shear
